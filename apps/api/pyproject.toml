[project]
name = "pbip-api"
version = "0.1.0"
description = "PBIP FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "redis>=5.2",
    "celery>=5.4",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "cryptography>=44",
    "pbip-ml",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "maxminddb>=3.2",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "greenlet>=3.5.6",
    "httpx>=0.28",
]

[tool.uv.sources]
pbip-ml = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbip_api"]

# TASK-086 mutation testing (docs/testing/mutation-report.md). Run from apps/api with the test DB env:
#   uv run mutmut run --max-children 1   (ONE worker: parallel workers share one test database and
#   truncate each other's tables, which reports false kills)
# mutmut 3 maps modules from ./src only, hence the config lives here rather than at the repo root.
[tool.mutmut]
source_paths = ["src"]
only_mutate = ["src/pbip_api/modules/ledger/service.py", "src/pbip_api/modules/payments/service.py"]
pytest_add_cli_args_test_selection = [
    "tests/integration/test_ledger.py",
    "tests/integration/test_ledger_guards.py",
    "tests/integration/test_transfers.py",
    "tests/integration/test_transfer_contract.py",
    "tests/unit/test_transfer_request_hash.py",
    "tests/integration/test_bills.py",
    "tests/integration/test_transaction_pagination.py",
    "tests/unit/test_ledger_initialization.py",
    "tests/unit/test_money.py",
]
pytest_add_cli_args = ["-p", "no:cacheprovider", "-q", "-x"]
# The integration conftest migrates the test database from these, relative to the tests.
also_copy = ["alembic.ini", "alembic/"]
# The stats pass leaves PostgreSQL connections and threads in mutmut's process; forking workers straight
# from it ("fork") made EVERY mutant fail, even ones the tests cannot see (a false 100%). forkserver
# forks from a clean process instead.
process_isolation = "forkserver"
log_to_file = true
