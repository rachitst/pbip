name: CI

# Pull-request pipeline. Maps to the PBIP requirement: Build -> Test -> Code Quality -> Security Scan.
# Only FIRST-PARTY actions are used; scanners are installed from lockfile-pinned packages.
# (Supply-chain lesson: mutable third-party action tags were abused in 2026 - see docs/PROJECT_BLUEPRINT.md.)
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api-quality:
    name: API - lint, types, boundaries, contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src ml/src data-gen/src
      - run: uv run lint-imports
      - name: OpenAPI contract is up to date
        run: uv run python scripts/export_openapi.py --check

  api-tests:
    name: API - unit, integration, security tests
    runs-on: ubuntu-latest
    # Hang guard, not a speed bar: the suite (2,500+ tests with coverage) took 19-21 min on the hosted runners on
    # 4 Nov 2026, and two runs on main were cut off at 20 min with every test passing (efadfc9, 4bf81e3).
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pbip
          POSTGRES_PASSWORD: pbip
          POSTGRES_DB: pbip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pbip -d pbip_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pbip:pbip@localhost:5432/pbip_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://pbip:pbip@localhost:5432/pbip_test
      DATABASE_URL: postgresql+psycopg://pbip:pbip@localhost:5432/pbip_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - name: Migrations apply, roll back, re-apply, and match the models
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini check
      - name: ER diagram matches the migrated schema (TASK-106)
        run: uv run python scripts/er_diagram.py --check
      - name: "Tests with coverage (gate - 80 percent)"
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage-xml, path: coverage.xml }

  ml-tests:
    name: ML + data-gen tests (no database allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - name: ML packages must not need PostgreSQL/Redis
        run: uv run pytest ml/tests data-gen/tests -q --no-cov

  web:
    name: Web - lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Generated API types match the OpenAPI contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

  security:
    name: Security - SAST, dependencies, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - name: Bandit (static analysis, medium+ severity)
        run: uv run bandit -q -r apps/api/src ml/src data-gen/src -ll
      - name: pip-audit (known-vulnerable Python dependencies)
        run: |
          uv export --frozen --all-packages --no-hashes --no-emit-workspace -o /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt --no-deps
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        working-directory: apps/web
      - name: detect-secrets (no new secrets vs. baseline)
        run: git ls-files -z | grep -zv -E '(^uv\.lock$|package-lock\.json$)' | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    # amd64 and arm64: the release images are multi-platform, so every PR proves both still build.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # arm64 (Oracle Cloud Ampere A1 staging host) is built under QEMU emulation. binfmt image pinned
      # by digest like every other image (ADR-0006 supply-chain rule); only the arm64 emulator is installed.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  e2e:
    name: E2E - Playwright against the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install uv==${{ env.UV_VERSION }} cryptography
      - run: python scripts/init_env.py
      - run: python scripts/dev_certs.py
      # Every Playwright browser signs in from ONE client IP: the overlay raises the per-IP sign-in and
      # registration limits for this stack only (infra/e2e/compose.e2e.yml, like infra/k6 for load tests).
      - name: Start the stack (E2E overlay raises the per-IP sign-in and registration limits)
        run: docker compose -f docker-compose.yml -f infra/e2e/compose.e2e.yml up -d --build
      - name: Wait for the stack (HTTPS, chain verified against the dev CA)
        run: curl --fail --silent --retry 60 --retry-delay 2 --retry-all-errors --cacert infra/certs/ca.crt https://localhost:8443/api/health/ready
      - name: TLS is enforced (HTTP redirects, HSTS, PostgreSQL rejects plain TCP)
        run: bash scripts/verify_tls.sh
      # The fraud-review journey signs in as the seeded analyst (MFA-enrolled). The password is generated
      # for this run, masked in the log and handed to Playwright only through the job environment.
      - name: Seed demo customers and MFA-enrolled staff with a generated password
        run: |
          PBIP_DEMO_PASSWORD="$(python -c 'import secrets; print(secrets.token_urlsafe(24) + "Aa1!")')"
          echo "::add-mask::$PBIP_DEMO_PASSWORD"
          echo "PBIP_DEMO_PASSWORD=$PBIP_DEMO_PASSWORD" >> "$GITHUB_ENV"
          export PBIP_DEMO_PASSWORD
          docker compose exec -T -e PBIP_DEMO_PASSWORD api python - < scripts/seed_dev.py
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env: { CI: "true" }
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v7
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  workflows:
    name: Workflow files - actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Not a GitHub Action: the official actionlint image, pinned by digest (ADR-0006 supply-chain rule).
      - name: actionlint (syntax, expressions, shellcheck of run steps)
        run: >-
          docker run --rm -v "$PWD:/repo:ro" -w /repo
          rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9
          -color

  ci-gate:
    name: CI Gate
    if: always()
    needs: [api-quality, api-tests, ml-tests, web, security, docker, e2e, workflows]
    runs-on: ubuntu-latest
    steps:
      # Every result must be "success": a skipped job (e.g. an `if:` added to a job) proves nothing.
      - name: All required jobs must have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
