name: CI

# Pull-request pipeline. Maps to the PBIP requirement: Build -> Test -> Code Quality -> Security Scan.
# Only FIRST-PARTY actions are used; scanners are installed from lockfile-pinned packages.
# (Supply-chain lesson: mutable third-party action tags were abused in 2026 - see docs/PROJECT_BLUEPRINT.md.)
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  api-quality:
    name: API - lint, types, boundaries, contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy apps/api/src ml/src data-gen/src
      - run: uv run lint-imports
      - name: OpenAPI contract is up to date
        run: uv run python scripts/export_openapi.py --check

  api-tests:
    name: API - unit, integration, security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pbip
          POSTGRES_PASSWORD: pbip
          POSTGRES_DB: pbip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pbip -d pbip_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://pbip:pbip@localhost:5432/pbip_test
      ALEMBIC_DATABASE_URL: postgresql+psycopg://pbip:pbip@localhost:5432/pbip_test
      DATABASE_URL: postgresql+psycopg://pbip:pbip@localhost:5432/pbip_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - name: Migrations apply, roll back, re-apply, and match the models
        run: |
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini downgrade base
          uv run alembic -c apps/api/alembic.ini upgrade head
          uv run alembic -c apps/api/alembic.ini check
      - name: "Tests with coverage (gate - 80 percent)"
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-xml, path: coverage.xml }

  ml-tests:
    name: ML + data-gen tests (no database allowed)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - name: ML packages must not need PostgreSQL/Redis
        run: uv run pytest ml/tests data-gen/tests -q --no-cov

  web:
    name: Web - lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run: { working-directory: apps/web }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: Generated API types match the OpenAPI contract
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts

  security:
    name: Security - SAST, dependencies, secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "${{ env.NODE_VERSION }}" }
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - name: Bandit (static analysis, medium+ severity)
        run: uv run bandit -q -r apps/api/src ml/src data-gen/src -ll
      - name: pip-audit (known-vulnerable Python dependencies)
        run: |
          uv export --frozen --all-packages --no-hashes --no-emit-workspace -o /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt --no-deps
      - name: npm audit (high+)
        run: npm audit --audit-level=high
        working-directory: apps/web
      - name: detect-secrets (no new secrets vs. baseline)
        run: git ls-files -z | grep -zv -E '(^uv\.lock$|package-lock\.json$)' | xargs -0 uv run detect-secrets-hook --baseline .secrets.baseline

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  e2e:
    name: E2E - Playwright against the full stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install uv==${{ env.UV_VERSION }} cryptography
      - run: python scripts/init_env.py
      - run: docker compose up -d --build
      - name: Wait for the stack
        run: curl --fail --silent --retry 60 --retry-delay 2 --retry-all-errors http://localhost:8080/api/health/ready
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env: { CI: "true" }
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/playwright-report }

  ci-gate:
    name: CI Gate
    if: always()
    needs: [api-quality, api-tests, ml-tests, web, security, docker, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs must have succeeded
        run: |
          echo "results: ${{ join(needs.*.result, ' ') }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
