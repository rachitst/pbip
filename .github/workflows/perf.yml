name: Performance

# TASK-078 / TASK-102: the k6 load suite and the browser page-load budgets against the full compose stack
# (HTTPS through nginx, hybrid fraud scorer on). Results are uploaded as an artifact with the runner's
# hardware; any crossed threshold or broken money invariant fails the job. Not a PR gate (it needs
# ~15 minutes): nightly, on demand, and on pushes to main that touch the API, web app or this suite.
# The API runs as API_REPLICAS processes, two like production (ADR-0045): one uvicorn process is
# bound to one core, and at this load it saturated on the slower runner CPUs (docs/testing).
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:
    inputs:
      vus: { description: "k6 virtual users", default: "50" }
      duration: { description: "k6 steady-state duration", default: "2m" }
      api_replicas: { description: "API processes (production runs 2)", default: "2" }
  push:
    branches: [main]
    paths: ["apps/**", "infra/k6/**", "infra/nginx/**", "docker-compose.yml", ".github/workflows/perf.yml"]

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  VUS: ${{ inputs.vus || '50' }}
  DURATION: ${{ inputs.duration || '2m' }}
  LOAD_USERS: "100"
  API_REPLICAS: ${{ inputs.api_replicas || '2' }}

jobs:
  load:
    name: k6 load suite and page-load budgets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install uv==${{ env.UV_VERSION }}
      - run: uv sync --all-packages --frozen
      - run: python scripts/init_env.py
      - run: uv run python scripts/dev_certs.py
      - name: Train the fraud models the hybrid scorer serves
        run: uv run python scripts/dev.py fraud-model
      - name: Start the stack with the load-test rate limits
        # No --wait: worker and beat have no healthcheck by design; wait on readiness like the e2e job.
        run: docker compose -f docker-compose.yml -f infra/k6/compose.load.yml up -d --build
      - name: Wait for the stack (HTTPS)
        run: curl --fail --silent --retry 60 --retry-delay 2 --retry-all-errors --cacert infra/certs/ca.crt https://localhost:8443/api/health/ready
      - name: Seed load users and snapshot the invariants
        run: |
          mkdir -p perf-results
          uv run python scripts/seed_load.py --users "$LOAD_USERS"
          uv run python scripts/load_invariants.py snapshot > perf-results/invariants-before.json
      - name: Describe the environment
        run: |
          {
            echo "runner: GitHub-hosted ${{ runner.os }} ${{ runner.arch }} ($RUNNER_NAME)"
            echo "cpus: $(nproc)"; lscpu | grep -E 'Model name|Thread|Core' || true
            free -h | head -2
            echo "vus: $VUS duration: $DURATION users: $LOAD_USERS target: https://localhost:8443 (nginx TLS -> api)"
            echo "api replicas: $(docker compose ps -q api | wc -l) (API_REPLICAS=$API_REPLICAS)"
            echo "commit: $GITHUB_SHA"
          } | tee perf-results/environment.txt
      - name: Reset the query statistics and sample container CPU during the run
        run: |
          docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -qc "CREATE EXTENSION IF NOT EXISTS pg_stat_statements; SELECT pg_stat_statements_reset();"' > /dev/null
          nohup sh -c 'while true; do date -u +%T; docker stats --no-stream --format "{{.Name}} {{.CPUPerc}} {{.MemUsage}}"; sleep 8; done' > perf-results/container-cpu.txt 2>&1 &
      - name: k6 load suite (thresholds = NFR budgets)
        env:
          BASE_URL: https://localhost:8443
          USERS: ${{ env.LOAD_USERS }}
        run: python scripts/dev.py load --summary-export /results/k6-summary.json
      - name: Money and concurrency invariants after the run
        if: always() && hashFiles('perf-results/invariants-before.json') != ''
        run: uv run python scripts/load_invariants.py check perf-results/invariants-before.json | tee perf-results/invariants-after.json
      - name: Slowest statements under load (pg_stat_statements, TASK-079)
        if: always() && hashFiles('perf-results/invariants-before.json') != ''
        run: docker compose exec -T db sh -c 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"' < infra/k6/top-statements.sql | tee perf-results/pg-stat-statements.txt
      # TASK-055 (#78): 500 events/s through the clickstream endpoint (k6 thresholds gate), then the
      # sequential per-request latency for 1, 10 and 100 events (recorded, not gated: a measurement).
      - name: Clickstream ingestion, 500 events/s (k6)
        env:
          BASE_URL: https://localhost:8443
          USERS: ${{ env.LOAD_USERS }}
        run: python scripts/dev.py load-events --summary-export /results/k6-events-summary.json
      - name: Clickstream per-request latency (batch sizes 1, 10, 100)
        run: >-
          uv run python scripts/measure_events_latency.py http --base-url https://localhost:8443
          --ca infra/certs/ca.crt --email load0001@perf.pbip --requests 300
          --json perf-results/events-latency.json | tee perf-results/events-latency.txt
      - name: Clickstream insert cost at the database (per batch and per event)
        run: >-
          uv run python scripts/measure_events_latency.py db --email load0001@perf.pbip
          --batches 300 --json perf-results/events-insert.json | tee perf-results/events-insert.txt
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Page-load and login budgets (Playwright)
        working-directory: apps/web
        # The JSON report goes to its own file: on stdout it was mixed with the list reporter.
        env: { CI: "true", PLAYWRIGHT_JSON_OUTPUT_NAME: ../../perf-results/page-load.json }
        run: npx playwright test e2e/perf.spec.ts --reporter=list,json --output=../../perf-results/playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: perf-results, path: perf-results }
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200 api web
