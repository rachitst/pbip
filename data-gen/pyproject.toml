[project]
name = "pbip-datagen"
version = "0.1.0"
description = "Deterministic synthetic banking data generator with labelled fraud injection"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "faker>=33.0",
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbip_datagen"]
