name: pbip

x-api-env: &api-env
  APP_ENV: ${APP_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # TLS to PostgreSQL, chain and host name verified against the local dev CA (scripts/dev_certs.py).
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/pbip-ca/ca.crt
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
  # The stack's own HTTPS origin is always trusted: the CSRF guard on refresh/logout rejects any Origin not in
  # this list, so without it session restore on https://localhost:8443 fails with 403 (existing .env files
  # list only the old http://localhost:8080).
  CORS_ORIGINS: ${CORS_ORIGINS},https://localhost:8443
  # The compose stack is served over HTTPS only (web :8443), so the refresh cookie is always Secure
  # and the API sends HSTS. `make dev-api` (Vite on http://localhost:5173) still reads .env.
  COOKIE_SECURE: "true"
  # AI assistant (blueprint section 8): Ollama runs on the HOST; containers reach it via
  # host.docker.internal (mapped to the host gateway on the api service below).
  OLLAMA_BASE_URL: ${OLLAMA_CONTAINER_URL:-http://host.docker.internal:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
  OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-4}
  OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-24h}
  ASSISTANT_LLM_ENABLED: ${ASSISTANT_LLM_ENABLED:-true}
  # Optional hosted router for unclear assistant questions (ADR-0037); default ollama sends nothing out.
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GROQ_MODEL: ${GROQ_MODEL:-}
  GROQ_REASONING_EFFORT: ${GROQ_REASONING_EFFORT:-}
  # Fraud scoring (ADR-0019): the demo uses the hybrid; ./models/fraud comes from `make fraud-model`.
  FRAUD_SCORER: ${FRAUD_SCORER:-hybrid}
  FRAUD_MODEL_DIR: /models/fraud
  # Model step budget, 5-100 ms (#362): set it in .env for a slow demo machine (docs/SETUP_GUIDE.md section 12).
  FRAUD_MODEL_BUDGET_MS: ${FRAUD_MODEL_BUDGET_MS:-50}
  # Recommendation ordering (ADR-0053): ./models/recommendations comes from `make recommendation-model`,
  # which writes a model only if it passed its gate against rules-v1. Absent or refused -> rules-v1.
  RECOMMENDATION_MODEL_DIR: /models/recommendations
  # Tracing (ADR 0017, ADR-0050): off unless .env says so. With OTEL_EXPORTER=otlp, start the `otel`
  # profile; if the collector is not running, spans are dropped and requests are unaffected.
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER: ${OTEL_EXPORTER:-none}
  OTEL_SAMPLE_RATE: ${OTEL_SAMPLE_RATE:-1.0}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_COLLECTOR_CONTAINER_URL:-http://otel-collector:4318}

x-dev-ca: &dev-ca ./infra/certs/ca.crt:/etc/pbip-ca/ca.crt:ro

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # TLS required for every TCP client (infra/postgres/tls-entrypoint.sh); certs: scripts/dev_certs.py
    entrypoint: ["/usr/local/bin/pbip-tls-entrypoint.sh"]
    command: ["postgres"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/10-init-test-db.sh:ro
      - ./infra/postgres/tls-entrypoint.sh:/usr/local/bin/pbip-tls-entrypoint.sh:ro
      - ./infra/certs/db:/etc/pbip-db-certs:ro
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Like api/worker/beat/web: after a reboot or a Docker restart the database must come back too,
    # or the API restarts into a stack with no database (bug bash, TASK-089).
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: *api-build
    environment: *api-env
    command: ["alembic", "-c", "/app/apps/api/alembic.ini", "upgrade", "head"]
    volumes: [*dev-ca]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    build: *api-build
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    # One uvicorn process per container (Dockerfile), so CPU-bound work scales with replicas
    # (ADR-0045). nginx and Prometheus find every replica through Docker's DNS name "api". Each
    # replica takes the next free host port from the range: the first one gets 8000.
    deploy:
      replicas: ${API_REPLICAS:-1}
    ports: ["127.0.0.1:8000-8003:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]  # Linux; Docker Desktop provides it already
    # Read-only: the API must never be able to rewrite the models it loads (threat model T34).
    volumes:
      - "./models/fraud:/models/fraud:ro"
      - "./models/recommendations:/models/recommendations:ro"
      - *dev-ca
    restart: unless-stopped

  worker:
    build: *api-build
    environment: *api-env
    # -E: emit task events so celery-exporter (monitoring profile) can count runs, failures and runtimes.
    command: ["celery", "-A", "pbip_api.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2", "-E"]
    volumes: [*dev-ca]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]

  beat:
    build: *api-build
    environment: *api-env
    command: ["celery", "-A", "pbip_api.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    volumes: [*dev-ca]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped
    healthcheck:
      test: ["NONE"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on: [api]
    # HTTPS on :8443 with the local dev CA (scripts/dev_certs.py); :8080 only redirects to it.
    environment:
      PUBLIC_HTTPS_PORT: "8443"
    volumes: ["./infra/certs/web:/etc/nginx/certs:ro"]
    ports: ["8080:8080", "8443:8443"]
    restart: unless-stopped

  # ---- optional profiles: `docker compose --profile ml up -d`, `--profile monitoring up -d`,
  # `--profile otel up -d` ----
  # Tracking + registry with a SQLite backend. Artifacts are PROXIED by the server
  # (--artifacts-destination), so clients upload over HTTP instead of writing to a
  # container-only path. Host allow-list covers the host port and the compose network.
  mlflow:
    profiles: [ml]
    image: ghcr.io/mlflow/mlflow:v3.5.0
    command: >
      mlflow server --host 0.0.0.0 --port 5000 --workers 2
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    volumes: [mlflow:/mlflow]
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0
    # 35 days of retention on a volume: the availability SLO is reported per calendar month (TASK-103).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=35d
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus:/prometheus
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]

  # Availability probes (TASK-103): HTTP checks of the health endpoints, the same path users take.
  blackbox-exporter:
    profiles: [monitoring]
    image: prom/blackbox-exporter:v0.27.0
    command: ["--config.file=/etc/blackbox/blackbox.yml"]
    volumes:
      - ./infra/prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
      - ./infra/certs/ca.crt:/etc/blackbox/ca.crt:ro

  # Celery task metrics from worker events (needs the worker's -E). MIT-licensed, pinned by digest.
  celery-exporter:
    profiles: [monitoring]
    image: danihodovic/celery-exporter:0.12.2@sha256:91e0b314cb5d62f0b2cd0ccdd059178d2d26f816ae0df2a4eeeb6b3c6feb5937
    command: ["--broker-url=redis://redis:6379/0", "--retry-interval=5"]
    depends_on:
      redis: { condition: service_healthy }

  redis-exporter:
    profiles: [monitoring]
    image: oliver006/redis_exporter:v1.75.0
    command: ["--redis.addr=redis://redis:6379", "--check-single-keys=db0=celery"]

  postgres-exporter:
    profiles: [monitoring]
    image: quay.io/prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=verify-full&sslrootcert=/etc/pbip-ca/ca.crt
    volumes: [*dev-ca]

  loki:
    profiles: [monitoring]
    image: grafana/loki:3.5.0
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes: ["./infra/loki/loki.yml:/etc/loki/loki.yml:ro", "loki:/loki"]

  alloy:
    profiles: [monitoring]
    image: grafana/alloy:v1.10.0
    command: ["run", "/etc/alloy/config.alloy"]
    volumes:
      - ./infra/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # OpenTelemetry Collector (issue #209, ADR-0050): OTLP/HTTP in, spans printed to its log. Apache-2.0,
  # the core distribution, pinned by digest. Enable with OTEL_ENABLED=true and OTEL_EXPORTER=otlp.
  otel-collector:
    profiles: [otel]
    image: otel/opentelemetry-collector:0.164.0@sha256:28b6d41ac51bff6b41ba5e8fe503569ffb9d6a1ea90f7a78419e86f34e44f750
    command: ["--config=/etc/otelcol/collector.yml"]
    environment:
      OTEL_COLLECTOR_VERBOSITY: ${OTEL_COLLECTOR_VERBOSITY:-basic}
    volumes: ["./infra/otel/collector.yml:/etc/otelcol/collector.yml:ro"]
    # Host port for `make dev-api` (OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318); loopback only.
    ports: ["127.0.0.1:4318:4318"]
    restart: unless-stopped

volumes:
  prometheus:
  pgdata:
  redisdata:
  mlflow:
  grafana:
  loki:
