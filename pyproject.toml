[project]
name = "pbip"
version = "0.1.0"
description = "Personal Banking Intelligence Platform - monorepo root"
requires-python = ">=3.12"
readme = "README.md"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "ml", "data-gen"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
    "bandit>=1.8",
    "pip-audit>=2.8",
    "detect-secrets>=1.5",
    "import-linter>=2.1",
    "pre-commit>=4.0",
    "fakeredis>=2.39.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "schemathesis>=4.32.7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["apps/api/alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # import sorting
    "N",             # naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit-style security checks
    "C4",            # comprehensions
    "SIM",           # simplifications
    "RUF",           # ruff-specific
    "C90",           # complexity
    "T20",           # no print()
    "PT",            # pytest style
    "DTZ",           # timezone-aware datetimes only
]
ignore = ["S101"]    # assert is fine in tests (enforced per-file below for src)

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Cookie"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "PLR2004", "PT018", "E501", "RUF059", "B023", "E731"]
"scripts/**" = ["T20", "S603", "S607"]
"**/src/**" = ["S101"]
"ml/notebooks/*.ipynb" = ["T20"]  # analysis reports: print() is the output, not app logging

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = ["apps/api/src", "ml/src", "data-gen/src"]
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["celery.*", "pyotp.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pbip_api.worker.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
pythonpath = [".", "apps/api/tests"]
testpaths = ["apps/api/tests", "ml/tests", "data-gen/tests"]
timeout = 60
markers = [
    "unit: fast, no external services",
    "integration: needs PostgreSQL and/or Redis",
    "security: authentication, authorization and hardening tests",
    "slow: long-running tests excluded from pre-push",
]

[tool.coverage.run]
branch = true
source = ["apps/api/src", "ml/src", "data-gen/src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.importlinter]
root_packages = ["pbip_api", "pbip_ml", "pbip_datagen"]

[[tool.importlinter.contracts]]
name = "core must not depend on feature modules"
type = "forbidden"
source_modules = ["pbip_api.core"]
forbidden_modules = ["pbip_api.modules"]

[[tool.importlinter.contracts]]
name = "ml package must not depend on the API"
type = "forbidden"
source_modules = ["pbip_ml", "pbip_datagen"]
forbidden_modules = ["pbip_api"]
