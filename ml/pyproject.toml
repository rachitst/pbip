[project]
name = "pbip-ml"
version = "0.1.0"
description = "PBIP ML/analytics package: contracts, features, inference. Training lives here too but is never imported by API request paths."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbip_ml"]
