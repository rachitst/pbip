# Included by every STATIC location (add_header is not inherited once a location defines its own).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
# Served only by the HTTPS server block (HTTP just redirects). Same policy as the API (core/middleware.py).
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
