# Overlay for load testing ONLY (TASK-078, TASK-055): every k6 virtual user comes from one IP, so the per-IP
# login, assistant and clickstream-event limits are raised for the duration of the test. Never use in staging/production.
#   docker compose -f docker-compose.yml -f infra/k6/compose.load.yml up -d --wait
# The limiter itself stays covered by test_login_rate_limit_per_ip, the assistant and the events rate-limit tests.
# Events: infra/k6/events.js sends 500 events/s as 5 batches/s (300/min) by default; 60000/min leaves room
# for BATCH_SIZE=1 at the same events/s.
services:
  api:
    environment:
      RATE_LIMIT_LOGIN_PER_MINUTE: "100000"
      RATE_LIMIT_ASSISTANT_PER_MINUTE: "600"
      RATE_LIMIT_EVENTS_PER_MINUTE: "60000"
  # TASK-079: per-statement timings during the run (top-statements.sql reads them afterwards).
  db:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
